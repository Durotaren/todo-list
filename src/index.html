<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <dialog>
      <h1>
        Please fill out this form if you wish to add a Due Date and/or Priority,
        otherwise just click Create.
      </h1>
      <form action="">
        <div>
          <label for="due-date">Due Date:</label>
          <label for="priority">Priority:</label>
        </div>
        <div>
          <input type="date" id="due-date" />
          <select name="" id="priority">
            <option value="High priority">High Priority</option>
            <option value="Low priority">Low Priority</option>
          </select>
        </div>
      </form>
      <div class="btns-container">
        <button class="close-btn">Close</button>
        <button class="submit-btn">Create</button>
      </div>
    </dialog>
    <div class="header">
      <p>Up<span>Todo</span></p>
      <img
        class="logout-svg"
        src="./assets/logout.svg"
        alt=""
        height="50px"
        width="40px"
      />
    </div>
    <div class="main">
      <div class="main-container">
        <div class="hero">
          <div class="hero-text">
            <p>Todos Done</p>
            <p>keep it up</p>
          </div>
          <div class="done-counter"></div>
        </div>
        <div class="input-field">
          <input
            placeholder="write your next task"
            type="text"
            name=""
            id="todo-input"
          />
          <button class="plus-sign">+</button>
        </div>
      </div>
      <div class="tasks-container"></div>
    </div>
  </body>
</html>
